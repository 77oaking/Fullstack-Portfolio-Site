<div class="head">
  <h1>Projects</h1>
  <a mat-flat-button color="primary" routerLink="/projects/add">
    <mat-icon>add</mat-icon> New project
  </a>
</div>

<div class="muted" *ngIf="loading">Loading…</div>

<table mat-table [dataSource]="projects" *ngIf="!loading && projects.length" class="full">
  <ng-container matColumnDef="order">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let p">{{ p.order }}</td>
  </ng-container>

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Title</th>
    <td mat-cell *matCellDef="let p">
      <a [routerLink]="['/projects/edit', p._id]">{{ p.title }}</a>
      <div class="slug">/{{ p.slug }}</div>
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let p">
      <span class="pill pill-{{ p.status }}">{{ p.status }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="featured">
    <th mat-header-cell *matHeaderCellDef>Featured</th>
    <td mat-cell *matCellDef="let p">
      <mat-icon *ngIf="p.featured" class="ico-on">star</mat-icon>
    </td>
  </ng-container>

  <ng-container matColumnDef="tags">
    <th mat-header-cell *matHeaderCellDef>Tags</th>
    <td mat-cell *matCellDef="let p">
      <span class="tag" *ngFor="let t of p.tags">{{ t }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let p">
      <a mat-icon-button [routerLink]="['/projects/edit', p._id]" matTooltip="Edit">
        <mat-icon>edit</mat-icon>
      </a>
      <button mat-icon-button (click)="remove(p)" matTooltip="Delete">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

<p class="muted" *ngIf="!loading && !projects.length">
  No projects yet. <a routerLink="/projects/add">Create the first one →</a>
</p>
