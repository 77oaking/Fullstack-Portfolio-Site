<div class="head">
  <h1>{{ id ? 'Edit project' : 'New project' }}</h1>
  <a mat-button routerLink="/projects">← All projects</a>
</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="form">
  <div class="row">
    <mat-form-field appearance="outline" class="grow">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="grow">
      <mat-label>Slug</mat-label>
      <input matInput formControlName="slug" placeholder="kebab-case" />
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Summary</mat-label>
    <input matInput formControlName="summary" maxlength="280" />
    <mat-hint align="end">280 chars max</mat-hint>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Description (markdown / HTML)</mat-label>
    <textarea matInput rows="10" formControlName="description"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Cover image URL</mat-label>
    <input matInput formControlName="coverImage" />
  </mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="grow">
      <mat-label>Tags (comma-separated)</mat-label>
      <input matInput formControlName="tags" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="grow">
      <mat-label>Tech stack (comma-separated)</mat-label>
      <input matInput formControlName="techStack" />
    </mat-form-field>
  </div>

  <fieldset class="links-block">
    <legend>Links</legend>
    <div class="link-row" *ngFor="let g of linksArray.controls; let i = index" [formGroup]="$any(g)">
      <mat-form-field appearance="outline">
        <mat-label>Label</mat-label>
        <input matInput formControlName="label" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="grow">
        <mat-label>URL</mat-label>
        <input matInput formControlName="url" />
      </mat-form-field>
      <button mat-icon-button type="button" (click)="removeLink(i)" matTooltip="Remove">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <button mat-stroked-button type="button" (click)="addLink()">
      <mat-icon>add</mat-icon> Add link
    </button>
  </fieldset>

  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option *ngFor="let s of statuses" [value]="s">{{ s }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Order</mat-label>
      <input matInput type="number" formControlName="order" />
    </mat-form-field>

    <mat-slide-toggle formControlName="featured">Featured on home</mat-slide-toggle>
  </div>

  <div class="actions">
    <button mat-flat-button color="primary" type="submit" [disabled]="loading">
      {{ id ? 'Save changes' : 'Create project' }}
    </button>
    <a mat-button routerLink="/projects">Cancel</a>
  </div>
</form>
