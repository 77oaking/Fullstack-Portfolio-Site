<mat-sidenav-container class="shell">
  <mat-sidenav
    class="sidebar"
    [mode]="sidenavMode"
    [opened]="sidebarOpen"
    [disableClose]="!isMobile"
  >
    <div class="brand">
      <span class="logo">P</span>
      <div>
        <span class="brand-text">Portfolio Admin</span>
        <small class="brand-subtitle">Content Workspace</small>
      </div>
    </div>

    <nav class="nav">
      <ng-container *ngFor="let section of navSections">
        <span class="nav-section-label">{{ section.label }}</span>
        <a
          *ngFor="let item of section.items"
          [routerLink]="item.link"
          routerLinkActive="active"
          (click)="onNavigate()"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>

    <div class="sidebar-footer">
      <span class="who">{{ adminName }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="topbar">
      <button mat-icon-button (click)="toggleSidebar()">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="topbar-title">
        <h1>Admin Control Panel</h1>
      </div>
      <button mat-stroked-button color="primary" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    </header>

    <main class="page">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
