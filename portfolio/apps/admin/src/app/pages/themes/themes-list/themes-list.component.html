<div class="head">
  <h1>Themes</h1>
  <span class="active-tag" *ngIf="active">Active: <strong>{{ active.name }}</strong></span>
</div>

<div class="layout">
  <ul class="list" *ngIf="!loading">
    <li *ngFor="let t of themes" [class.is-active]="isActive(t)">
      <button class="theme" (click)="preview(t)">
        <div class="dot" [style.background]="t.tokens.color.primary"></div>
        <div>
          <div class="name">{{ t.name }}</div>
          <div class="desc">{{ t.description }}</div>
        </div>
      </button>
      <button mat-flat-button color="primary" (click)="activate(t)" [disabled]="isActive(t)">
        {{ isActive(t) ? 'Active' : 'Activate' }}
      </button>
    </li>
  </ul>

  <section class="preview" #previewSection>
    <header class="preview-hero">
      <h2>Preview</h2>
      <p>Pick a theme on the left to preview its tokens here. Activate it to make it the public default.</p>
    </header>
    <div class="preview-card">
      <h3>Project card</h3>
      <p>This card is styled with the previewed theme's CSS custom properties.</p>
      <div class="preview-tags">
        <span class="preview-tag">angular</span>
        <span class="preview-tag">nestjs</span>
        <span class="preview-tag">mongodb</span>
      </div>
      <button class="preview-btn">Primary action</button>
    </div>
  </section>
</div>
