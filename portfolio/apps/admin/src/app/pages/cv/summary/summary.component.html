<div class="cv-page">
  <div class="cv-page-header">
    <div>
      <h1 class="cv-page-title">Professional Summary</h1>
      <p class="cv-page-subtitle">A brief overview that appears at the top of your CV</p>
    </div>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saving || loading">
      <mat-icon>save</mat-icon>
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </div>

  <div *ngIf="loading" class="cv-loading">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()">
    <mat-card>
      <mat-card-content>
        <mat-form-field appearance="outline" style="width:100%">
          <mat-label>Summary</mat-label>
          <textarea
            matInput
            formControlName="text"
            rows="8"
            placeholder="Write a compelling professional summary…"
          ></textarea>
          <mat-hint>Aim for 3–5 sentences. AI assistance will be available here in a future update.</mat-hint>
          <mat-error *ngIf="form.get('text')?.hasError('required')">Required</mat-error>
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  </form>
</div>
