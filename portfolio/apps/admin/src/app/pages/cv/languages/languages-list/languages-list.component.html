<div class="cv-page cv-page-wide">
  <div class="cv-list-toolbar">
    <div>
      <h1 class="cv-page-title">Languages</h1>
      <p class="cv-page-subtitle">Spoken and written language proficiency</p>
    </div>
    <button mat-flat-button color="primary" (click)="add()">
      <mat-icon>add</mat-icon>
      Add Language
    </button>
  </div>

  <div *ngIf="loading" class="cv-loading"><mat-spinner diameter="36"></mat-spinner></div>

  <ng-container *ngIf="!loading">
    <p *ngIf="items.length === 0" class="cv-empty">No languages yet.</p>

    <mat-card *ngIf="items.length > 0" class="cv-table-wrap">
      <table mat-table [dataSource]="items" style="width:100%">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Language</th>
          <td mat-cell *matCellDef="let item">{{ item.name }}</td>
        </ng-container>

        <ng-container matColumnDef="proficiency">
          <th mat-header-cell *matHeaderCellDef>Proficiency</th>
          <td mat-cell *matCellDef="let item">
            <span class="proficiency-badge proficiency-{{ item.proficiency }}">
              {{ proficiencyLabel[item.proficiency] }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item" class="actions-cell">
            <button mat-icon-button (click)="edit(item)" matTooltip="Edit"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(item)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card>
  </ng-container>
</div>
