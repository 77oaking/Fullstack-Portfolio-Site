<div class="cv-page">
  <div class="cv-page-header">
    <div>
      <h1 class="cv-page-title">Personal Data</h1>
      <p class="cv-page-subtitle">Basic contact and identity information</p>
    </div>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saving || loading">
      <mat-icon>save</mat-icon>
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </div>

  <div *ngIf="loading" class="cv-loading">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <form *ngIf="!loading" [formGroup]="form" class="cv-form" (ngSubmit)="save()">
    <mat-card>
      <mat-card-header><mat-card-title>Identity</mat-card-title></mat-card-header>
      <mat-card-content class="card-grid">
        <mat-form-field appearance="outline">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" />
          <mat-error *ngIf="form.get('firstName')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" />
          <mat-error *ngIf="form.get('lastName')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-span-2">
          <mat-label>Professional Headline</mat-label>
          <input matInput formControlName="headline" placeholder="e.g. Full-Stack Developer" />
          <mat-error *ngIf="form.get('headline')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <div class="col-span-2 photo-upload">
          <label class="photo-label">Profile Photo</label>
          <div class="photo-actions">
            <input
              #photoInput
              type="file"
              accept="image/*"
              class="photo-file-input"
              (change)="onPhotoSelected($event)"
            />
            <button mat-stroked-button type="button" (click)="photoInput.click()">
              <mat-icon>upload</mat-icon>
              Upload from device
            </button>
            <button
              *ngIf="form.get('photo')?.value"
              mat-button
              color="warn"
              type="button"
              (click)="clearPhoto()"
            >
              Remove
            </button>
          </div>
          <p class="photo-help">JPG, PNG, or WEBP. Max size 5 MB.</p>
          <img *ngIf="form.get('photo')?.value" [src]="form.get('photo')?.value" alt="Profile preview" class="photo-preview" />
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card>
      <mat-card-header><mat-card-title>Contact</mat-card-title></mat-card-header>
      <mat-card-content class="card-grid">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error *ngIf="form.get('email')?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>City</mat-label>
          <input matInput formControlName="city" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="col-span-2">
          <mat-label>Full Address</mat-label>
          <input matInput formControlName="address" />
        </mat-form-field>
      </mat-card-content>
    </mat-card>

    <mat-card>
      <mat-card-header><mat-card-title>Online Presence</mat-card-title></mat-card-header>
      <mat-card-content class="card-grid">
        <mat-form-field appearance="outline">
          <mat-label>Website</mat-label>
          <input matInput formControlName="website" placeholder="https://…" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>LinkedIn URL</mat-label>
          <input matInput formControlName="linkedin" placeholder="https://linkedin.com/in/…" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>GitHub URL</mat-label>
          <input matInput formControlName="github" placeholder="https://github.com/…" />
        </mat-form-field>
      </mat-card-content>
    </mat-card>
  </form>
</div>
