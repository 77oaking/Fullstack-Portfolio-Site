<div class="cv-page cv-page-wide">
  <div class="cv-list-toolbar">
    <div>
      <h1 class="cv-page-title">Awards & Achievements</h1>
      <p class="cv-page-subtitle">Honours, prizes, and notable recognitions</p>
    </div>
    <button mat-flat-button color="primary" (click)="add()">
      <mat-icon>add</mat-icon>
      Add Award
    </button>
  </div>

  <div *ngIf="loading" class="cv-loading"><mat-spinner diameter="36"></mat-spinner></div>

  <ng-container *ngIf="!loading">
    <p *ngIf="items.length === 0" class="cv-empty">No awards yet.</p>

    <mat-card *ngIf="items.length > 0" class="cv-table-wrap">
      <table mat-table [dataSource]="items" style="width:100%">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Award</th>
          <td mat-cell *matCellDef="let item">{{ item.title }}</td>
        </ng-container>

        <ng-container matColumnDef="issuer">
          <th mat-header-cell *matHeaderCellDef>Issuer</th>
          <td mat-cell *matCellDef="let item">{{ item.issuer }}</td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let item">{{ formatDate(item.date) }}</td>
        </ng-container>

        <ng-container matColumnDef="visible">
          <th mat-header-cell *matHeaderCellDef>Visible</th>
          <td mat-cell *matCellDef="let item">
            <mat-icon [style.color]="item.visible ? 'var(--color-success)' : 'var(--color-fg-muted)'">
              {{ item.visible ? 'visibility' : 'visibility_off' }}
            </mat-icon>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item" class="actions-cell">
            <button mat-icon-button (click)="edit(item)" matTooltip="Edit"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="delete(item)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card>
  </ng-container>
</div>
