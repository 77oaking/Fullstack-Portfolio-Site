<div class="cv-page">
  <button class="cv-back" (click)="back()"><mat-icon>arrow_back</mat-icon> Back to References</button>

  <div class="cv-page-header">
    <div>
      <h1 class="cv-page-title">{{ editId ? 'Edit Reference' : 'Add Reference' }}</h1>
    </div>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saving || loading">
      <mat-icon>save</mat-icon>
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </div>

  <div *ngIf="loading" class="cv-loading"><mat-spinner diameter="36"></mat-spinner></div>

  <form *ngIf="!loading" [formGroup]="form" class="cv-form">
    <mat-card>
      <mat-card-content class="card-grid">
        <mat-form-field appearance="outline" class="col-span-2">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="name" />
          <mat-error>Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Job Title / Position</mat-label>
          <input matInput formControlName="position" />
          <mat-error>Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Company</mat-label>
          <input matInput formControlName="company" />
          <mat-error>Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Relationship</mat-label>
          <input matInput formControlName="relationship" placeholder="e.g. Former Manager" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Order</mat-label>
          <input matInput formControlName="order" type="number" />
        </mat-form-field>

        <div class="col-span-2">
          <mat-slide-toggle formControlName="visible">Visible on CV</mat-slide-toggle>
        </div>
      </mat-card-content>
    </mat-card>
  </form>
</div>
